<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 103 93">
  <!-- Frontier Security Institute mark, redrawn as vectors from icon-src/logo-original.png.
       Navy arcs share a center below the bottom-right corner; red arcs mirror them from the
       bottom-left. Both sets are clipped to the inside of the frame. -->
  <defs><clipPath id="inside"><rect x="5" y="5" width="93" height="83"/></clipPath></defs>
  <rect x="5" y="5" width="93" height="83" fill="#fff"/>
  <g clip-path="url(#inside)" fill="none">
    <g stroke="#ED1C24" stroke-width="5">
      <circle cx="5" cy="110" r="98"/><circle cx="5" cy="110" r="80"/>
      <circle cx="5" cy="110" r="61"/><circle cx="5" cy="110" r="43"/>
    </g>
    <g stroke="#1C1D5F" stroke-width="5.5">
      <circle cx="98" cy="110" r="98"/><circle cx="98" cy="110" r="80"/>
      <circle cx="98" cy="110" r="61"/><circle cx="98" cy="110" r="43"/>
    </g>
  </g>
  <rect x="2.5" y="2.5" width="98" height="88" fill="none" stroke="#1C1D5F" stroke-width="5"/>
</svg>
